server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pasalapeli_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
          jwk-set-uri: ${AZURE_AD_JWK_SET_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}
  # ============================================================
  # Mensajeria asincrona (AWS SQS): consume eventos de notificacion.
  # La topologia (topic, colas, DLQ, filter policy) la crea
  # scripts/setup-messaging.sh (idempotente, sin recursos IAM).
  # ============================================================
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        use-default-aws-credentials-chain: true

# Configuracion de la app (clave unica: YAML no permite claves duplicadas)
app:
  sqs:
    queue-url: ${SQS_QUEUE_URL:pasalapeli-notificaciones}
    dlq-url: ${SQS_DLQ_URL:}
    dlq-name: ${SQS_DLQ_NAME:pasalapeli-notificaciones-dlq}
  # CORS configurable (en produccion usar el dominio real, nunca *)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Seguridad (defensa en profundidad; el BFF valida en el borde)
azure:
  activedirectory:
    enabled: ${AZURE_AUTH_ENABLED:false}
    client-id: ${AZURE_CLIENT_ID:00000000-0000-0000-0000-000000000000}
    tenant-id: ${AZURE_TENANT_ID:common}
    app-id-uri: ${AZURE_APP_ID_URI:api://00000000-0000-0000-0000-000000000000}

# Actuator - healthcheck para Docker
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
