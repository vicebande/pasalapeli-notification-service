# SonarQube Cloud (analisis en CI bloquea el deploy) - https://sonarcloud.io
sonar.projectKey=vicebande_pasalapeli-notification-service
sonar.organization=vicebande
sonar.projectName=Pasa La Peli - notification-service

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.exclusions=**/target/**
sonar.java.source=21
# Sin tests ni JaCoCo: Sonar reporta 0% de cobertura en CI en cualquier linea
# nueva y el gate new_coverage (<80%) bloquearia cada cambio sin forma de
# cumplirlo. Se excluye hasta incorporar tests + reporte JaCoCo (quitar aqui).
sonar.coverage.exclusions=**/*.java
